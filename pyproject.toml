[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "srcflow"
version = "0.5.0"
description = "Dependency flow visualizer for JS/TS/Python/Go/Rust/Java/C++ and more"
requires-python = ">=3.9"
authors = [{ name = "Saivamsi Chakrala", email = "chakralasaivamsi2003@gmail.com" }]
readme = "README.md"
keywords = ["javascript", "typescript", "dependency", "visualization", "flow", "graph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/SaivamC/srcflow"
"Bug Tracker" = "https://github.com/SaivamC/srcflow/issues"

[project.scripts]
srcflow = "depflow.cli:main"
